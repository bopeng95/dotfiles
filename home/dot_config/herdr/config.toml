onboarding = false
# herdr configuration
# Place this file at ~/.config/herdr/config.toml

# Show first-run notification setup on startup.
# Missing also shows onboarding; set false after you've chosen.
# onboarding = true

[theme]
name = "catppuccin"
auto_switch = false

[terminal]

[update]

[keys]
navigate_workspace_up = "k"
navigate_workspace_down = "j"

command = [
  { key = "ctrl+h", type = "plugin_action", command = "vim-herdr-navigation.left" },
  { key = "ctrl+j", type = "plugin_action", command = "vim-herdr-navigation.down" },
  { key = "ctrl+k", type = "plugin_action", command = "vim-herdr-navigation.up" },
  { key = "ctrl+l", type = "plugin_action", command = "vim-herdr-navigation.right" },
]

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]

[ui.toast.herdr]

[ui.toast.clipboard]

[ui.sound]

[session]

[remote]

[experimental]

pane_history = false

[advanced]
